# macOS Developer ID 서명 → 공증 → GitHub Release
#
# 트리거: mac-v* 태그 푸시 또는 Actions 수동 실행
# 예: git tag mac-v1.0.0 && git push origin mac-v1.0.0
#
# 필요한 GitHub Secrets (Settings → Secrets and variables → Actions):
#   MAC_CERTIFICATE_BASE64          Developer ID Application .p12 (base64)
#   MAC_CERTIFICATE_PASSWORD        p12 암호
#   APPLE_TEAM_ID                   팀 ID (예: 44HRTG996V)
#   APP_STORE_CONNECT_API_KEY_ID    App Store Connect API Key ID
#   APP_STORE_CONNECT_API_ISSUER_ID Issuer ID
#   APP_STORE_CONNECT_API_KEY_P8    AuthKey_XXXX.p8 전체 내용
#   GOOGLE_SERVICE_INFO_PLIST_MAC_BASE64
#                                   SNUECafeteriaMac/GoogleService-Info.plist (base64)
#
# 선택:
#   MAC_PROVISION_PROFILE_APP_BASE64    앱 Developer ID 프로비저닝 프로필
#   MAC_PROVISION_PROFILE_WIDGET_BASE64 위젯 Developer ID 프로비저닝 프로필
#   (App Groups 등 샌드박스 권한이 있으면 프로필이 필요할 수 있음)

name: macOS Release

on:
  push:
    tags:
      - "mac-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without prefix (e.g. 1.0.1). Empty = timestamp."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: SNUECafeteriaMac
  SCHEME: SNUECafeteriaMac
  TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
  BUILD_DIR: ${{ github.workspace }}/build

jobs:
  build-sign-notarize-release:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # macOS 26 deployment target → Xcode 26 SDK 필요. 러너에 없으면 latest로 시도.
          xcode-version: latest

      - name: Show Xcode / SDK
        run: |
          xcodebuild -version
          xcrun --show-sdk-version --sdk macosx

      - name: Install mise + Tuist
        uses: jdx/mise-action@v2
        with:
          version: latest
          install: true
          cache: true

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#mac-v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="0.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=mac-v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION}"

      - name: Inject GoogleService-Info.plist (Mac)
        env:
          PLIST_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_MAC_BASE64 }}
        run: |
          if [[ -z "${PLIST_B64}" ]]; then
            echo "Missing secret GOOGLE_SERVICE_INFO_PLIST_MAC_BASE64" >&2
            exit 1
          fi
          echo "${PLIST_B64}" | base64 --decode > SNUECafeteriaMac/GoogleService-Info.plist
          test -s SNUECafeteriaMac/GoogleService-Info.plist

      - name: Import Developer ID certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.MAC_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}

      - name: Install provisioning profiles (optional)
        env:
          APP_PROFILE_B64: ${{ secrets.MAC_PROVISION_PROFILE_APP_BASE64 }}
          WIDGET_PROFILE_B64: ${{ secrets.MAC_PROVISION_PROFILE_WIDGET_BASE64 }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          install_profile() {
            local b64="$1"
            local label="$2"
            if [[ -z "${b64}" ]]; then
              echo "Skip ${label} profile (secret empty)"
              return 0
            fi
            local tmp
            tmp="$(mktemp)"
            echo "${b64}" | base64 --decode > "${tmp}"
            local uuid
            uuid="$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$(security cms -D -i "${tmp}")")"
            cp "${tmp}" "$HOME/Library/MobileDevice/Provisioning Profiles/${uuid}.mobileprovision"
            echo "Installed ${label} profile ${uuid}"
            rm -f "${tmp}"
          }
          install_profile "${APP_PROFILE_B64}" "app"
          install_profile "${WIDGET_PROFILE_B64}" "widget"

      - name: Tuist install & generate
        run: |
          tuist version
          tuist install
          tuist generate --no-open

      - name: Archive (Developer ID + Hardened Runtime)
        run: |
          mkdir -p "${BUILD_DIR}"
          set +e
          xcodebuild \
            -workspace SNUECafeteriaProject.xcworkspace \
            -scheme "${SCHEME}" \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath "${BUILD_DIR}/${APP_NAME}.xcarchive" \
            DEVELOPMENT_TEAM="${TEAM_ID}" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            ENABLE_HARDENED_RUNTIME=YES \
            OTHER_CODE_SIGN_FLAGS="--timestamp" \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive | tee "${BUILD_DIR}/archive.log" | xcbeautify
          status=${PIPESTATUS[0]}
          set -e
          if [[ ${status} -ne 0 ]]; then
            echo "Archive failed. Tail of log:" >&2
            tail -n 80 "${BUILD_DIR}/archive.log" >&2
            exit ${status}
          fi

      - name: Export Developer ID app
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath "${BUILD_DIR}/${APP_NAME}.xcarchive" \
            -exportPath "${BUILD_DIR}/export" \
            -exportOptionsPlist ci/exportOptions-mac-developer-id.plist \
            -allowProvisioningUpdates
          test -d "${BUILD_DIR}/export/${APP_NAME}.app"
          ditto "${BUILD_DIR}/export/${APP_NAME}.app" "${BUILD_DIR}/${APP_NAME}.app"

      - name: Zip for notarization
        run: |
          ditto -c -k --keepParent \
            "${BUILD_DIR}/${APP_NAME}.app" \
            "${BUILD_DIR}/${APP_NAME}-notarize.zip"

      - name: Notarize with notarytool
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          KEY_PATH="${RUNNER_TEMP}/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "${ASC_KEY_P8}" > "${KEY_PATH}"
          xcrun notarytool submit \
            "${BUILD_DIR}/${APP_NAME}-notarize.zip" \
            --key "${KEY_PATH}" \
            --key-id "${ASC_KEY_ID}" \
            --issuer "${ASC_ISSUER_ID}" \
            --wait
          xcrun stapler staple "${BUILD_DIR}/${APP_NAME}.app"
          spctl --assess --type execute --verbose=4 "${BUILD_DIR}/${APP_NAME}.app" || true

      - name: Package release zip
        id: package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ASSET="교대학식-macOS-${VERSION}.zip"
          # ZIP 파일명은 ASCII로 두어 Actions artifact/upload 호환성을 높인다.
          ASSET_ASCII="SNUECafeteria-macOS-${VERSION}.zip"
          ditto -c -k --keepParent \
            "${BUILD_DIR}/${APP_NAME}.app" \
            "${BUILD_DIR}/${ASSET_ASCII}"
          echo "asset=${ASSET_ASCII}" >> "$GITHUB_OUTPUT"
          ls -lh "${BUILD_DIR}/${ASSET_ASCII}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: macOS ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: ${{ env.BUILD_DIR }}/${{ steps.package.outputs.asset }}
          fail_on_unmatched_files: true
          body: |
            ## 교대학식 macOS ${{ steps.version.outputs.version }}

            Developer ID로 서명·공증된 빌드입니다.

            1. `SNUECafeteria-macOS-*.zip` 다운로드 후 압축 해제
            2. `SNUECafeteriaMac.app`을 응용 프로그램 폴더로 이동
            3. 첫 실행 시 Gatekeeper가 막으면: 시스템 설정 → 개인정보 보호 및 보안 → 확인 후 열기

            > 이 저장소의 배포 제한(학교 식단·서비스 맥락 외부 배포 금지)을 확인하세요. README **중요 안내**를 따릅니다.
